name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  windows-ci:
    name: Windows CI & QEMU Full Suite
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-none

      - name: Install QEMU and NASM
        run: |
          choco install qemu nasm -y --no-progress
          echo "C:\Program Files\qemu" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Check workspace
        run: cargo check --workspace

      - name: Run unit, integration & sample scripts tests
        run: cargo test --package pulselang-core --package pulc

      - name: Test kernel boot
        run: cargo xtask test-boot

      - name: Test PulseEditor scrolling
        run: cargo xtask test-editor-scroll

      - name: Test editor delete
        run: cargo xtask test-editor-delete

      - name: Test paste
        run: cargo xtask test-paste

      - name: Test compile error diagnostics
        run: cargo xtask test-compile-error

      - name: Test px64 architecture
        run: cargo xtask test-px64

      - name: Test standalone bundle
        run: cargo xtask test-standalone

  linux-ci:
    name: Linux Headless CI & Sample Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-none

      - name: Install QEMU and NASM on Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 nasm

      - name: Check kernel target
        run: cargo check --package kernel --target x86_64-unknown-none

      - name: Run unit & integration tests on Linux
        run: cargo test --package pulselang-core --package pulc

      - name: Test all documented sample scripts via pulc
        run: cargo test --package pulc --test samples
